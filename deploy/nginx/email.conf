# nginx site for the dashboard and API. Needs this once in the http block of nginx.conf if absent:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Replace SERVER_NAME and the certificate paths, or use deploy.sh.
limit_req_zone $binary_remote_addr zone=oae_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=oae_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME;

    client_max_body_size 40m;

    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req_status 429;

    # Sign-in goes through the dashboard session route: tight per-IP limit
    location = /api/session {
        limit_req zone=oae_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3200;
    }

    # SES delivery notifications (the dashboard has its own /webhooks page, so match exactly)
    location = /webhooks/ses {
        limit_req zone=oae_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8200;
    }

    # REST, MCP, health, API docs, unsubscribe and review links, live WebSocket stream
    location ~ ^/(v1|mcp|health|ready|docs|openapi\.json|unsubscribe|review-link)(/|$) {
        limit_req zone=oae_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
